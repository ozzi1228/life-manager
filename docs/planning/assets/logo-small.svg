<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 작은 크기용 아이콘(D-058): 로고의 보라 다이어리를 단순화. 16px 탭 아이콘에서도 보이도록 굵은 면과 진한 테두리 -->
  <g stroke="#7d6a93" stroke-width="2.5" stroke-linejoin="round">
    <!-- 뒤표지 -->
    <rect x="7" y="9" width="46" height="50" rx="7" fill="#b4a0c9"/>
    <!-- 속지(오른쪽으로 살짝 보임)와 색 탭 -->
    <rect x="50" y="12" width="7" height="9" rx="2.5" fill="#f5b8bd"/>
    <rect x="50" y="42" width="7" height="8" rx="2.5" fill="#a9bf8c"/>
    <rect x="15" y="10" width="38" height="45" rx="4" fill="#f6e7b9"/>
    <!-- 앞표지 -->
    <rect x="13" y="6" width="36" height="46" rx="6" fill="#fdf5ec"/>
  </g>
  <!-- 책등 -->
  <path d="M13 12a6 6 0 0 1 6-6h0v46h0a6 6 0 0 1-6-6z" fill="#b4a0c9" stroke="#7d6a93" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 웃는 입(로고의 oona 아래 미소) -->
  <path d="M23 30q7 7 14 0" fill="none" stroke="#7d6a93" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 잠금 끈과 단추 -->
  <rect x="43" y="24" width="15" height="13" rx="5" fill="#b4a0c9" stroke="#7d6a93" stroke-width="2.5"/>
  <circle cx="51" cy="30.5" r="2.8" fill="#fdf5ec"/>
</svg>
