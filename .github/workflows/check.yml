# 올릴 때마다 타입·린트 검사(DB가 필요한 확인 스크립트는 이 PC에서 npm run check:db)
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
